[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polarion-validation-studio"
version = "0.5.0"
description = "Polarion ALM Validation Studio - Automated Testing. Configuration Validation. Version Compatibility."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "keyring>=25",
    "pyyaml>=6",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]
browser = ["playwright>=1.45"]

[project.scripts]
pavs = "pavs.__main__:main"
pavs-cli = "pavs.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pavs*", "mock_polarion*"]

[tool.setuptools.package-data]
"pavs.polarion.capabilities" = ["data/*.json", "data/*.yaml"]
"pavs.engines.analysis" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
